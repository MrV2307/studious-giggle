name: Margin quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint
      - name: Build production app
        run: npm run build
        env:
          BETTER_AUTH_URL: https://margin-journal-vparmarbhardwaj-7101.vercel.app
          NEXT_PUBLIC_SITE_URL: https://margin-journal-vparmarbhardwaj-7101.vercel.app
